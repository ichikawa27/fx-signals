name: FX Signal Evaluate

on:
  schedule:
    # 毎時17分に実行（scan の 5分間隔 0,5,10,15,20... と被らない時刻）
    - cron: '17 * * * *'
  workflow_dispatch:  # 手動実行可

concurrency:
  group: fx-signals-evaluate
  cancel-in-progress: false

permissions:
  contents: write  # results.csv を commit/push するため

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-runtime.txt

      - name: Run signal evaluation (N時間後の終値方式)
        run: python evaluate_signals.py

      - name: Run signal evaluation (TP/SL方式)
        run: python evaluate_signals_tpsl.py

      - name: Commit evaluation results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase --autostash || true

          git add logs/results.csv logs/results_tpsl.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new evaluations to commit"
          else
            git commit -m "chore: update evaluation results [skip ci]"
            git push
          fi
